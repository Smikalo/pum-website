services:
  web:
    # Image names parameterised by owner/repo (non-secret)
    image: ghcr.io/${GITHUB_OWNER:-smikalo}/${REPO_NAME:-pum-website}-web:latest
    restart: unless-stopped
    environment:
      # Port the Next.js app listens on inside the container
      - PORT=3000

      # Internal API base for SSR (used by web/lib/config.ts)
      - API_BASE_INTERNAL=${API_BASE_INTERNAL:-http://api:3001}
      - API_BASE=${API_BASE:-http://api:3001}

      # Public API base that the browser calls
      - NEXT_PUBLIC_API_BASE=${NEXT_PUBLIC_API_BASE:-http://localhost:3001}

      # Map style URL – DO NOT commit your real key into .env.example
      - NEXT_PUBLIC_MAP_STYLE_URL=${NEXT_PUBLIC_MAP_STYLE_URL}

      # Secret for /api/revalidate – do not set a real default here
      - REVALIDATE_SECRET=${REVALIDATE_SECRET}
    networks: [pum]
    expose: ["3000"]
    depends_on:
      api:
        condition: service_healthy  # wait for API readiness

  api:
    image: ghcr.io/${GITHUB_OWNER:-smikalo}/${REPO_NAME:-pum-website}-api:latest
    # if you build in CI, keep both image+build so compose tags the image accordingly
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - api_uploads:/srv/uploads
    environment:
      # Port the API listens on inside the container
      - PORT=${API_PORT:-3001}

      # Node environment; if you want stricter checks, set NODE_ENV=production in the server env
      - NODE_ENV=${NODE_ENV:-production}

      # Database connection; defaults to local dockerised Postgres
      - POSTGRES_DB=${POSTGRES_DB:-pum}
      - POSTGRES_USER=${POSTGRES_USER:-pum}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-devpass}
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-pum}:${POSTGRES_PASSWORD:-devpass}@db:5432/${POSTGRES_DB:-pum}?schema=public}

      # Origins / public base URLs (non-secret)
      - WEB_ORIGIN=${WEB_ORIGIN:-http://localhost:3000}
      - PUBLIC_API_BASE=${PUBLIC_API_BASE:-http://localhost:3001}

      # Cookies / CSRF flags (non-secret; secrets live in JWT/DB/etc)
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - COOKIE_SAMESITE=${COOKIE_SAMESITE:-Lax}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-}
      - COOKIE_PATH=${COOKIE_PATH:-/api/auth}
      - REFRESH_COOKIE_NAME=${REFRESH_COOKIE_NAME:-refreshToken}
      - CSRF_COOKIE_NAME=${CSRF_COOKIE_NAME:-XSRF-TOKEN}

      # Rate limiting (non-secret)
      - LOGIN_RATE_WINDOW_MS=${LOGIN_RATE_WINDOW_MS:-600000}   # 10 minutes
      - LOGIN_RATE_MAX=${LOGIN_RATE_MAX:-10}
      - PUBLIC_RATE_WINDOW_MS=${PUBLIC_RATE_WINDOW_MS:-60000}  # 1 minute
      - PUBLIC_RATE_MAX=${PUBLIC_RATE_MAX:-100}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-200}

      # Mail (SMTP password is still provided only via real env on the server)
      - MAIL_FROM=${MAIL_FROM:-contact@example.com}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - NEWSLETTER_SECRET=${NEWSLETTER_SECRET}

      # JWT / crypto secrets are intentionally NOT defaulted here.
      # They are read from process.env in api/src/config.js.
      # Set JWT_ACCESS_SECRET etc. only in real envs (.env not committed, or server env vars).
    networks: [pum]
    expose: ["3001"]
    # simple node-based healthcheck against /healthz (no curl/wget needed)
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e 'http=require(\"http\");http.get(\"http://localhost:3001/healthz\",r=>process.exit(r.statusCode===200?0:1)).on(\"error\",()=>process.exit(1))'",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy  # wait until Postgres passes its healthcheck

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-pum}
      - POSTGRES_USER=${POSTGRES_USER:-pum}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-devpass}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1 -p 5432 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [pum]

networks: { pum: {} }

volumes:
  pg-data: {}
  api_uploads:
